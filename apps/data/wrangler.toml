name = "ganju-data"
main = "src/index.ts"
compatibility_date = "2025-11-17"

compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[limits]
cpu_ms = 30000

[env.development]
name = "ganju-data-development"
workers_dev = false
preview_urls = false
[env.development.observability]
enabled = true
[env.development.observability.logs]
enabled = true
invocation_logs = true
[[env.development.r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "ganju-storage-development"
[[env.development.durable_objects.bindings]]
name = "PROJECT_DATABASE"
class_name = "ProjectDatabase"
[[env.development.migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectDatabase"]

[env.production]
name = "ganju-data-production"
workers_dev = false
preview_urls = false
[env.production.observability]
enabled = true
[env.production.observability.logs]
enabled = true
invocation_logs = true
[[env.production.r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "ganju-storage-production"
[[env.production.durable_objects.bindings]]
name = "PROJECT_DATABASE"
class_name = "ProjectDatabase"
[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectDatabase"]
